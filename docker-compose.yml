# Single-node replica set so Mongoose transactions work locally.
# Transactions are required to reserve multiple line items atomically.
services:
  mongodb:
    image: mongo:7.0
    container_name: pos-mongodb
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - pos_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }) }"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  pos_mongo_data:
